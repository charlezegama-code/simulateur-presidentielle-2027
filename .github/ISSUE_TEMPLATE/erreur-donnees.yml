name: Signaler une erreur de données
description: Une mesure mal résumée, une source morte, un statut de candidat obsolète, une mesure manquante…
title: "[Données] "
labels: ["donnees"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Chaque correction doit s'appuyer sur une source publique et datée.
        Ne mets aucune information personnelle (et surtout pas tes réponses au questionnaire).
  - type: input
    id: candidat
    attributes:
      label: Candidat·e concerné·e
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type d'erreur
      options:
        - Mesure mal résumée ou mal chiffrée
        - Source morte ou incorrecte
        - Mesure manquante
        - Mesure abandonnée ou modifiée
        - Statut du candidat obsolète
        - Formulation non neutre
        - Autre
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Ce qui est faux et ce qui devrait être affiché
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source (URL)
      description: Lien vers le programme officiel, une déclaration publique datée ou un chiffrage.
      placeholder: https://
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date de publication de la source
      placeholder: AAAA-MM-JJ
    validations:
      required: true
