name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validation des données
        run: npm run validate-data
      - name: Tests
        run: npm test
      - name: Build (+ contrôle du bundle)
        run: npm run build
      - name: Déploiement Cloudflare Pages (preview sur PR, production sur main)
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=simulateur-presidentielle-2027 --branch=${{ github.head_ref || github.ref_name }}
